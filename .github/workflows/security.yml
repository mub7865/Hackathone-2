name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-scan-backend:
    name: Backend Dependency Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      working-directory: ./calm-orbit-todo/phase5-cloud/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety bandit

    - name: Run Safety check
      working-directory: ./calm-orbit-todo/phase5-cloud/backend
      run: |
        safety check --json --output safety-report.json || true
        safety check || true

    - name: Run Bandit security linter
      working-directory: ./calm-orbit-todo/phase5-cloud/backend
      run: |
        bandit -r app/ -f json -o bandit-report.json || true
        bandit -r app/ -ll -ii

    - name: Upload Safety report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: safety-report
        path: ./calm-orbit-todo/phase5-cloud/backend/safety-report.json

    - name: Upload Bandit report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-report
        path: ./calm-orbit-todo/phase5-cloud/backend/bandit-report.json

  dependency-scan-frontend:
    name: Frontend Dependency Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./calm-orbit-todo/phase5-cloud/frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./calm-orbit-todo/phase5-cloud/frontend
      run: npm ci

    - name: Run npm audit
      working-directory: ./calm-orbit-todo/phase5-cloud/frontend
      run: |
        npm audit --json > npm-audit-report.json || true
        npm audit || true

    - name: Upload npm audit report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: npm-audit-report
        path: ./calm-orbit-todo/phase5-cloud/frontend/npm-audit-report.json

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{matrix.language}}"

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build backend Docker image
      working-directory: ./calm-orbit-todo/phase5-cloud/backend
      run: |
        docker build -t todo-backend:test -f Dockerfile .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'todo-backend:test'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Trivy vulnerability scanner (table output)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'todo-backend:test'
        format: 'table'
        severity: 'CRITICAL,HIGH,MEDIUM'

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/python
          p/javascript

  license-scan:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install pip-licenses
      run: pip install pip-licenses

    - name: Check Python licenses
      working-directory: ./calm-orbit-todo/phase5-cloud/backend
      run: |
        pip install -r requirements.txt
        pip-licenses --format=json --output-file=licenses.json
        pip-licenses --fail-on="GPL;AGPL"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Check Node.js licenses
      working-directory: ./calm-orbit-todo/phase5-cloud/frontend
      run: |
        npm ci
        npx license-checker --json --out licenses.json
        npx license-checker --failOn "GPL;AGPL"

    - name: Upload license reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: license-reports
        path: |
          ./calm-orbit-todo/phase5-cloud/backend/licenses.json
          ./calm-orbit-todo/phase5-cloud/frontend/licenses.json

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan-backend, dependency-scan-frontend, codeql-analysis, container-scan, secret-scan, sast-scan, license-scan]
    if: always()

    steps:
    - name: Check security scan results
      run: |
        if [ "${{ needs.dependency-scan-backend.result }}" != "success" ] || \
           [ "${{ needs.dependency-scan-frontend.result }}" != "success" ] || \
           [ "${{ needs.codeql-analysis.result }}" != "success" ] || \
           [ "${{ needs.container-scan.result }}" != "success" ] || \
           [ "${{ needs.secret-scan.result }}" != "success" ] || \
           [ "${{ needs.sast-scan.result }}" != "success" ] || \
           [ "${{ needs.license-scan.result }}" != "success" ]; then
          echo "⚠️ Some security scans failed or found issues"
          exit 1
        else
          echo "✅ All security scans passed"
        fi
