---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics-config
  namespace: default
data:
  topics.yaml: |
    # Kafka Topics Configuration for Todo Application

    topics:
      # Task Events Topic
      - name: todo-app.task-events
        partitions: 3
        replication_factor: 1
        config:
          retention.ms: 604800000  # 7 days
          cleanup.policy: delete
          compression.type: snappy
          min.insync.replicas: 1
        description: "Events for task CRUD operations (created, updated, deleted, completed)"

      # Reminders Topic
      - name: todo-app.reminders
        partitions: 3
        replication_factor: 1
        config:
          retention.ms: 259200000  # 3 days
          cleanup.policy: delete
          compression.type: snappy
          min.insync.replicas: 1
        description: "Events for task reminders and due date notifications"

      # Recurring Tasks Topic
      - name: todo-app.recurring-tasks
        partitions: 2
        replication_factor: 1
        config:
          retention.ms: 604800000  # 7 days
          cleanup.policy: delete
          compression.type: snappy
          min.insync.replicas: 1
        description: "Events for recurring task generation and management"

      # Task Updates Topic (for real-time WebSocket broadcasting)
      - name: todo-app.task-updates
        partitions: 3
        replication_factor: 1
        config:
          retention.ms: 86400000  # 1 day
          cleanup.policy: delete
          compression.type: snappy
          min.insync.replicas: 1
        description: "Real-time task updates for WebSocket broadcasting"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-setup
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: kafka-topics-creator
        image: confluentinc/cp-kafka:7.5.0
        command:
        - /bin/bash
        - -c
        - |
          # Wait for Kafka to be ready
          echo "Waiting for Kafka to be ready..."
          cub kafka-ready -b kafka:9092 1 30

          # Create topics
          echo "Creating Kafka topics..."

          kafka-topics --bootstrap-server kafka:9092 --create \
            --topic todo-app.task-events \
            --partitions 3 \
            --replication-factor 1 \
            --config retention.ms=604800000 \
            --config cleanup.policy=delete \
            --config compression.type=snappy \
            --if-not-exists

          kafka-topics --bootstrap-server kafka:9092 --create \
            --topic todo-app.reminders \
            --partitions 3 \
            --replication-factor 1 \
            --config retention.ms=259200000 \
            --config cleanup.policy=delete \
            --config compression.type=snappy \
            --if-not-exists

          kafka-topics --bootstrap-server kafka:9092 --create \
            --topic todo-app.recurring-tasks \
            --partitions 2 \
            --replication-factor 1 \
            --config retention.ms=604800000 \
            --config cleanup.policy=delete \
            --config compression.type=snappy \
            --if-not-exists

          kafka-topics --bootstrap-server kafka:9092 --create \
            --topic todo-app.task-updates \
            --partitions 3 \
            --replication-factor 1 \
            --config retention.ms=86400000 \
            --config cleanup.policy=delete \
            --config compression.type=snappy \
            --if-not-exists

          echo "Kafka topics created successfully!"

          # List topics
          echo "Listing all topics:"
          kafka-topics --bootstrap-server kafka:9092 --list

          # Describe topics
          echo "Topic details:"
          kafka-topics --bootstrap-server kafka:9092 --describe
      restartPolicy: OnFailure
  backoffLimit: 3
